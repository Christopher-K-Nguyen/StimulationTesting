name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    # Tests under tests/ are pure-Python (no PyQt6 imports), so any
    # vanilla Python runner works — no Xvfb / Qt platform plugin
    # needed. Matrix kept small to stay under GitHub's free-tier
    # minutes; expand if you start exercising the GUI in CI.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          # Editable install so tests/ can import stimtest without an
          # extra PYTHONPATH dance. The [dev] extra brings pytest etc.
          pip install -e ".[dev]"

      - name: Run pytest
        # tests/ covers metrics, simulator, and waveform math — none
        # of which need hardware or a display.
        run: pytest tests/ -v
