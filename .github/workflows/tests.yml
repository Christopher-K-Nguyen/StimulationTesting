name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    # Tests under tests/ are pure-Python (no PyQt6 fixtures used), but
    # the dev extras pull in pytest-qt, whose pytest_configure hook
    # auto-imports PyQt6 at session start. PyQt6's binary wheel has a
    # transitive ELF dep on libEGL.so.1 (and a few X libs) that bare
    # Ubuntu runners don't ship — so we install just enough to satisfy
    # the loader, and tell Qt to use the offscreen platform plugin so
    # nothing tries to open a display.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    env:
      # Force the Qt offscreen platform so anything that ever does
      # instantiate a QApplication doesn't need an X server. Harmless
      # for non-GUI code — Qt just doesn't try to find xcb / wayland.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        # Minimum set to make `import PyQt6.QtGui` succeed on a fresh
        # ubuntu-latest runner. libxcb-cursor0 is required by Qt 6.5+
        # whenever the xcb plugin is loaded; we keep it in case the
        # offscreen plugin falls back. Add more here only if a future
        # test actually exercises a Qt feature that pulls them in.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxcb-cursor0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          # Editable install so tests/ can import stimtest without an
          # extra PYTHONPATH dance. The [dev] extra brings pytest etc.
          pip install -e ".[dev]"

      - name: Run pytest
        # tests/ covers metrics, simulator, and waveform math — none
        # of which need hardware. The QT_QPA_PLATFORM=offscreen env
        # above keeps pytest-qt's import path happy without a display.
        run: pytest tests/ -v
