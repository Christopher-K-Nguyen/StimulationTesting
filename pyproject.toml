[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stimtest"
version = "0.2.226"
description = "PULSAR — Python characterization suite for neural-stimulation electrodes (Plexon PlexStim + Tektronix scope), with the POLARIS companion session viewer."
readme = "README.md"
license = {text = "MIT"}
# Bundled installer ships Python 3.13; the build script uses
# ``tomllib`` (stdlib since 3.11) and the codebase uses PEP 604
# union syntax (``int | None``) which is 3.10+.  3.10 is the
# real floor; 3.13 is what we test against.
requires-python = ">=3.10,<4"
authors = [{name = "Christopher K. Nguyen"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PyQt6>=6.5",
    "pyqtgraph>=0.13",
    "pyvisa>=1.13",
    "pyvisa-py>=0.7",   # pure-Python VISA backend; NI-VISA preferred when available
    "pyserial>=3.5",    # STM32 bias module driver (USB CDC ACM virtual COM port)
    "matplotlib>=3.7",  # Results-tab plotting + viewer + auto-save plots
    "openpyxl>=3.1",    # Gamry-DTA-style .xlsx export
    "pandas>=2.0",      # tabular session export + ML weakness analyzer
    "scikit-learn>=1.3", # GBM-based Q_inj predictor + weakness analysis
    "joblib>=1.3",      # ML model persistence (.pkl load/save); ships with
                        # scikit-learn but the app imports it directly
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-qt>=4", "ruff"]
mat = ["scipy"]   # for .mat I/O (already a hard dep above)
build = ["pyinstaller>=6.0"]   # only needed on the build machine

[project.scripts]
stimtest-gui = "stimtest.gui.main_window:main"

[tool.setuptools]
packages = {find = {include = ["stimtest*"]}}
include-package-data = true

[tool.setuptools.package-data]
"stimtest.hardware.pyplexstim" = ["bin/*.dll", "*.pdf"]
