[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stimtest"
version = "0.2.0"
description = "Python translation of PlexStimTek for characterizing stimulation electrodes (Plexon PlexStim + Tektronix scope)."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Christopher K. Nguyen"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PyQt6>=6.5",
    "pyqtgraph>=0.13",
    "pyvisa>=1.13",
    "pyvisa-py>=0.7",   # pure-Python VISA backend; NI-VISA preferred when available
    "openpyxl>=3.1",    # Gamry-DTA-style .xlsx export
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-qt>=4", "ruff", "matplotlib"]
mat = ["scipy"]   # for .mat I/O (already a hard dep above)
build = ["pyinstaller>=6.0"]   # only needed on the build machine

[project.scripts]
stimtest-gui = "stimtest.gui.main_window:main"

[tool.setuptools]
packages = {find = {include = ["stimtest*"]}}
include-package-data = true

[tool.setuptools.package-data]
"stimtest.hardware.pyplexstim" = ["bin/*.dll", "*.pdf"]
